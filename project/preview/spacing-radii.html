<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="frame">
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:16px; align-items:end;">
    <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:4px;background:var(--brand);margin:0 auto 8px;"></div><div class="label">xs · 4</div></div>
    <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:8px;background:var(--brand);margin:0 auto 8px;"></div><div class="label">sm · 8</div></div>
    <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:12px;background:var(--brand);margin:0 auto 8px;"></div><div class="label">md · 12</div></div>
    <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:16px;background:var(--brand);margin:0 auto 8px;"></div><div class="label">lg · 16 ★</div></div>
    <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:20px;background:var(--brand);margin:0 auto 8px;"></div><div class="label">xl · 20</div></div>
    <div style="text-align:center;"><div style="width:56px;height:56px;border-radius:28px;background:var(--brand);margin:0 auto 8px;"></div><div class="label">2xl · 28</div></div>
  </div>
  <div style="margin-top:14px; display:flex; gap:14px; align-items:center;">
    <div style="height:36px; width:36px; border-radius:999px; background:var(--brand);"></div>
    <span class="label">pill · 999</span>
    <span style="margin-left:auto; font-size:12px; color:var(--fg-muted);">★ default cards & sheets</span>
  </div>
</div>
</body></html>
