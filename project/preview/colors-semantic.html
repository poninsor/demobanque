<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="frame">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 14px;">
    <div class="swatch">
      <div class="chip" style="background:var(--success); display:flex; align-items:flex-end; padding:10px; color:#fff; font-size:12px; font-weight:600;">+ 240,00 €</div>
      <div class="meta"><span class="name">Success · Crédits</span><span class="hex">#00A35A</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--warning); display:flex; align-items:flex-end; padding:10px; color:#fff; font-size:12px; font-weight:600;">En attente</div>
      <div class="meta"><span class="name">Warning · Pending</span><span class="hex">#F59E0B</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--danger); display:flex; align-items:flex-end; padding:10px; color:#fff; font-size:12px; font-weight:600;">Refusé</div>
      <div class="meta"><span class="name">Danger · Erreurs</span><span class="hex">#E11D48</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--info); display:flex; align-items:flex-end; padding:10px; color:#fff; font-size:12px; font-weight:600;">Info</div>
      <div class="meta"><span class="name">Info · Neutre actif</span><span class="hex">#0066B3</span></div>
    </div>
  </div>
  <div style="margin-top:14px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px;">
    <div style="background:var(--success-50); color:var(--success-700); padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600;">+ 240,00 € reçus</div>
    <div style="background:var(--warning-50); color:var(--warning-700); padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600;">Virement programmé</div>
    <div style="background:var(--danger-50); color:var(--danger-700); padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600;">Solde insuffisant</div>
    <div style="background:var(--info-50); color:var(--info-700); padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600;">Nouvelle offre</div>
  </div>
</div>
</body></html>
