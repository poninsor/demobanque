<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="frame">
  <div class="grid" style="grid-template-columns: repeat(11, 1fr); gap: 6px;">
    <div class="swatch"><div class="chip" style="background:var(--neutral-0); border-bottom:1px solid var(--border);"></div><div class="meta"><span class="name">0</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-25)"></div><div class="meta"><span class="name">25</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-50)"></div><div class="meta"><span class="name">50</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-100)"></div><div class="meta"><span class="name">100</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-200)"></div><div class="meta"><span class="name">200</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-300)"></div><div class="meta"><span class="name">300</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-400)"></div><div class="meta"><span class="name">400</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-500)"></div><div class="meta"><span class="name">500</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-600)"></div><div class="meta"><span class="name">600</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-700)"></div><div class="meta"><span class="name">700</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--neutral-900)"></div><div class="meta"><span class="name">900</span></div></div>
  </div>
  <div style="margin-top:14px; display:flex; gap:18px; flex-wrap:wrap; font-size:13px;">
    <span><b style="color:var(--fg)">fg</b> <code class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);">neutral-900</code></span>
    <span><b style="color:var(--fg-muted)">fg-muted</b> <code class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);">neutral-500</code></span>
    <span><b style="color:var(--fg-faint)">fg-faint</b> <code class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);">neutral-400</code></span>
    <span style="color:var(--fg-muted);">border <code class="hex" style="font-family:var(--font-mono);">neutral-100</code></span>
  </div>
</div>
</body></html>
