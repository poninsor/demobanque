<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="frame" style="background:var(--bg-sunken);">
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:18px;">
    <div style="text-align:center;"><div style="width:80px;height:60px;border-radius:12px;background:#fff;box-shadow:var(--shadow-xs);margin:0 auto 10px;"></div><div class="label">xs</div></div>
    <div style="text-align:center;"><div style="width:80px;height:60px;border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);margin:0 auto 10px;"></div><div class="label">sm · cards</div></div>
    <div style="text-align:center;"><div style="width:80px;height:60px;border-radius:12px;background:#fff;box-shadow:var(--shadow-md);margin:0 auto 10px;"></div><div class="label">md · hover</div></div>
    <div style="text-align:center;"><div style="width:80px;height:60px;border-radius:12px;background:#fff;box-shadow:var(--shadow-lg);margin:0 auto 10px;"></div><div class="label">lg · menus</div></div>
    <div style="text-align:center;"><div style="width:80px;height:60px;border-radius:12px;background:#fff;box-shadow:var(--shadow-xl);margin:0 auto 10px;"></div><div class="label">xl · modals</div></div>
  </div>
  <div style="margin-top:18px; display:flex; gap:14px; align-items:center;">
    <div style="width:120px;height:44px;border-radius:12px;background:var(--brand);box-shadow:var(--shadow-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;">CTA hover</div>
    <span class="label">shadow-brand · CTA primaire au hover</span>
  </div>
</div>
</body></html>
