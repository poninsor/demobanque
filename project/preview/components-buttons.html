<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
.btn {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  border: 0;
  border-radius: 12px;
  padding: 0 18px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 220ms var(--ease-out);
  letter-spacing: -0.01em;
}
.btn-primary { background: var(--brand); color: var(--brand-fg); }
.btn-primary:hover { background: var(--brand-600); box-shadow: var(--shadow-brand); }
.btn-secondary { background: var(--bg-elev); color: var(--fg); border:1px solid var(--border-strong); }
.btn-secondary:hover { background: var(--bg-inset); }
.btn-ghost { background: transparent; color: var(--fg); }
.btn-ghost:hover { background: var(--bg-inset); }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn-lg { height: 52px; padding: 0 24px; font-size: 16px; border-radius: 14px; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="frame">
  <div class="row" style="gap:10px;">
    <button class="btn btn-primary">Faire un virement</button>
    <button class="btn btn-secondary">Annuler</button>
    <button class="btn btn-ghost">Plus tard</button>
    <button class="btn btn-danger">Supprimer</button>
    <button class="btn btn-primary" disabled>Désactivé</button>
  </div>
  <div class="row" style="margin-top:14px; gap:10px;">
    <button class="btn btn-primary btn-lg">Continuer</button>
    <button class="btn btn-primary">Standard</button>
    <button class="btn btn-primary btn-sm">Compact</button>
    <button class="btn btn-secondary btn-sm">+ Bénéficiaire</button>
  </div>
  <div style="margin-top:12px; font-size:12px; color:var(--fg-muted); font-family:var(--font-mono);">radius 12 · h 44 · weight 600 · transition 220ms</div>
</div>
</body></html>
