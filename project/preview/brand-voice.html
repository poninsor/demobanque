<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="frame">
  <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start;">
    <div style="background:var(--success-50); border-left:3px solid var(--success); padding:12px 14px; border-radius:10px; font-size:14px; max-width:300px;">
      <b style="color:var(--success-700)">C'est parti !</b> Le virement de 250 € arrivera demain.
    </div>
    <div style="background:var(--warning-50); border-left:3px solid var(--warning); padding:12px 14px; border-radius:10px; font-size:14px; max-width:300px;">
      <b style="color:var(--warning-700)">En attente.</b> Ton virement programmé arrivera le 15 mai.
    </div>
    <div style="background:var(--danger-50); border-left:3px solid var(--danger); padding:12px 14px; border-radius:10px; font-size:14px; max-width:300px;">
      <b style="color:var(--danger-700)">Le RIB ne semble pas valide.</b> Vérifie les chiffres.
    </div>
  </div>
  <div style="margin-top:14px; padding:14px; background:var(--bg-sunken); border-radius:12px; max-width:520px;">
    <div style="font-weight:600; margin-bottom:4px;">Aucune opération ce mois-ci.</div>
    <div style="font-size:14px; color:var(--fg-muted);">Profite-en pour respirer. Tes prochaines opérations s'afficheront ici.</div>
  </div>
</div>
</body></html>
