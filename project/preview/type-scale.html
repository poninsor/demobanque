<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="frame" style="display:grid;grid-template-columns:auto 1fr auto;gap:14px 24px;align-items:baseline;">
  <span style="font-family:var(--font-display); font-weight:700; font-size:48px; letter-spacing:-0.02em; line-height:1;">H1</span>
  <span style="font-family:var(--font-display); font-weight:700; font-size:48px; letter-spacing:-0.02em;">Faire un virement</span>
  <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);font-size:12px;">48 · 700 · −0.02em</span>

  <span style="font-family:var(--font-display); font-weight:700; font-size:36px; letter-spacing:-0.02em; line-height:1;">H2</span>
  <span style="font-family:var(--font-display); font-weight:700; font-size:36px; letter-spacing:-0.02em;">Bénéficiaires</span>
  <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);font-size:12px;">36 · 700</span>

  <span style="font-family:var(--font-display); font-weight:600; font-size:24px; letter-spacing:-0.01em; line-height:1;">H3</span>
  <span style="font-family:var(--font-display); font-weight:600; font-size:24px; letter-spacing:-0.01em;">Compte courant</span>
  <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);font-size:12px;">24 · 600</span>

  <span style="font-family:var(--font-display); font-weight:600; font-size:20px;">H4</span>
  <span style="font-family:var(--font-display); font-weight:600; font-size:20px;">Carte Visa Premier</span>
  <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);font-size:12px;">20 · 600</span>

  <span style="font-family:var(--font-body); font-size:16px;">Body</span>
  <span style="font-family:var(--font-body); font-size:16px;">Tu peux faire un virement en quelques secondes.</span>
  <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);font-size:12px;">16 · 400</span>

  <span style="font-family:var(--font-body); font-size:14px; color:var(--fg-muted);">Meta</span>
  <span style="font-family:var(--font-body); font-size:14px; color:var(--fg-muted);">aujourd'hui · 14:32 · IBAN ****6892</span>
  <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);font-size:12px;">14 · muted</span>

  <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted);">Overline</span>
  <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted);">Récents · Ce mois-ci</span>
  <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);font-size:12px;">12 · 600 · 0.08em</span>
</div>
</body></html>
