<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head>
<body>
<div class="frame">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
    <div style="background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:var(--shadow-sm);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div class="label">Compte courant</div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-muted);">****6892</div>
      </div>
      <div style="font-family:var(--font-display); font-weight:600; font-size:32px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;">12&nbsp;480,57&nbsp;€</div>
      <div style="margin-top:6px; font-size:12px; color:var(--success-700); font-weight:600;">+ 240,00 € ce mois-ci</div>
    </div>
    <div style="background:linear-gradient(135deg, #ff7a4a 0%, var(--brand-500) 45%, var(--brand-800) 100%); color:white; border-radius:16px; padding:18px; box-shadow:var(--shadow-md);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; opacity:0.8;">Livret A</div>
        <div style="font-family:var(--font-mono); font-size:11px; opacity:0.8;">★ Hero card</div>
      </div>
      <div style="font-family:var(--font-display); font-weight:600; font-size:32px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;">22&nbsp;950,00&nbsp;€</div>
      <div style="margin-top:6px; font-size:12px; opacity:0.85;">Taux 3,00 % · Plafond 22 950 €</div>
    </div>
  </div>
  <div style="margin-top:12px; font-size:12px; color:var(--fg-muted); font-family:var(--font-mono);">Compte standard · Livret hero (gradient brand → noir)</div>
</div>
</body></html>
