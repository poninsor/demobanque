<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="frame">
  <div style="display:flex; gap:24px; align-items:center; flex-wrap:wrap;">
    <div style="background:#fff; padding:16px 20px; border-radius:14px; border:1px solid var(--border);">
      <img src="../assets/logo.svg" height="40" alt="Démo banque">
    </div>
    <div style="background:var(--neutral-900); padding:16px 20px; border-radius:14px;">
      <img src="../assets/logo-light.svg" height="40" alt="Démo banque (dark)">
    </div>
    <div style="background:var(--brand); padding:16px; border-radius:14px;">
      <img src="../assets/logo-mark.svg" height="48" alt="Mark">
    </div>
    <div style="background:#fff; padding:16px; border-radius:14px; border:1px solid var(--border);">
      <img src="../assets/logo-mark.svg" height="48" alt="Mark">
    </div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:var(--fg-muted); font-family:var(--font-mono);">
    logo · logo-light · logo-mark · logo-mark sur brand
  </div>
</div>
</body></html>
