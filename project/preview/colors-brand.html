<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="frame">
  <div class="grid" style="grid-template-columns: repeat(10, 1fr); gap: 6px;">
    <div class="swatch"><div class="chip" style="background:var(--brand-50)"></div><div class="meta"><span class="name">50</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-100)"></div><div class="meta"><span class="name">100</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-200)"></div><div class="meta"><span class="name">200</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-300)"></div><div class="meta"><span class="name">300</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-400)"></div><div class="meta"><span class="name">400</span></div></div>
    <div class="swatch" style="border-color:var(--brand-500)"><div class="chip" style="background:var(--brand-500)"></div><div class="meta"><span class="name" style="color:var(--brand-700)">500 ★</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-600)"></div><div class="meta"><span class="name">600</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-700)"></div><div class="meta"><span class="name">700</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-800)"></div><div class="meta"><span class="name">800</span></div></div>
    <div class="swatch"><div class="chip" style="background:var(--brand-900)"></div><div class="meta"><span class="name">900</span></div></div>
  </div>
  <div style="margin-top:14px; display:flex; gap:14px; align-items:center;">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="dot" style="background:var(--brand-500)"></div>
      <span style="font-weight:600;">Brand · Genesys Orange</span>
      <span class="hex" style="font-family:var(--font-mono);color:var(--fg-muted);">#FF4515</span>
    </div>
    <span class="label" style="margin-left:auto;">CTA · Active state · Accent narratif</span>
  </div>
</div>
</body></html>
